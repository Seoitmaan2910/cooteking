
<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotte & Mahta – My Loves</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #fdfdfd;
      color: #333;
      direction: rtl;
      text-align: center;
      padding: 20px;
    }
    img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }
    .gallery-item {
      margin-bottom: 40px;
    }
  </style>
</head>
<body>

  <h1>Cotte & Mahta – My Loves 😻</h1>
  <section id="gallery"></section>

  <footer style="margin-top: 50px; font-size: 0.9rem; color: #777;">
    © 2025 Cotte & Mahta. تمام حقوق محفوظ است.
  </footer>

  <script>
    fetch('gallery.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('gallery');
        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'gallery-item';
          div.innerHTML = `<img src="images/${item.image}" alt="${item.caption}">
                           <p>${item.caption}</p>`;
          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
